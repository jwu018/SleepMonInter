# Tool configuration only. api/ is run with uvicorn, not installed as a package,
# so there is no [project] table here. Same rules as tools/pyproject.toml.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests `import app` when pytest is run from the api/ folder.
pythonpath = ["."]
